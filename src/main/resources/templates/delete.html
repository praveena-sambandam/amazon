<!DOCTYPE html>
<html>

<head>
<meta charset="UTF-8">
<title>Success</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#0f0c29,#302b63,#24243e);
}

.card{
width:450px;
background:rgba(255,255,255,0.08);
padding:50px;
border-radius:25px;
text-align:center;
backdrop-filter:blur(10px);
box-shadow:0px 10px 30px rgba(0,0,0,0.4);
color:white;
}

.icon{
font-size:80px;
margin-bottom:20px;
}

h1{
font-size:40px;
margin-bottom:20px;
}

p{
font-size:20px;
color:#d0c7ff;
margin-bottom:35px;
}

.btn{
text-decoration:none;
padding:15px 35px;
border-radius:12px;
background:linear-gradient(45deg,#7F00FF,#E100FF);
color:white;
font-size:18px;
display:inline-block;
transition:0.3s;
}

.btn:hover{
transform:scale(1.05);
}

</style>

</head>

<body>

<div class="card">

<div class="icon">
✅
</div>

<h1>Success</h1>

<p>
Product Deleted Successfully
</p>

<a href="/select" class="btn">
Back To Products
</a>

</div>

</body>
</html>
