<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Edit Product</title>

<style>

body{
    margin:0;
    font-family:Arial, sans-serif;
    background:linear-gradient(to right,#141e30,#243b55);
    color:white;
}

.navbar{
    background:#111827;
    padding:15px;
    display:flex;
    justify-content:center;
    gap:30px;
}

.navbar a{
    color:white;
    text-decoration:none;
    font-size:18px;
    font-weight:bold;
}

.navbar a:hover{
    color:#00d4ff;
}

.container{
    display:flex;
    justify-content:center;
    align-items:center;
    height:85vh;
}

.form-box{
    background:white;
    color:black;
    width:400px;
    padding:35px;
    border-radius:20px;
    box-shadow:0px 8px 20px rgba(0,0,0,0.4);
}

.form-box h1{
    text-align:center;
    margin-bottom:25px;
    color:#6c63ff;
}

label{
    font-weight:bold;
}

input{
    width:100%;
    padding:12px;
    margin-top:8px;
    margin-bottom:20px;
    border-radius:10px;
    border:1px solid #ccc;
    font-size:15px;
}

button{
    width:100%;
    padding:14px;
    border:none;
    border-radius:10px;
    background:#6c63ff;
    color:white;
    font-size:18px;
    cursor:pointer;
}

button:hover{
    background:#5548e8;
}

</style>

</head>
<body>

<div class="navbar">
    <a href="/home">Home</a>
    <a href="/select">Products</a>
</div>

<div class="container">

<div class="form-box">

<h1>Edit Product</h1>

<form action="/abc" method="post">

<input type="hidden"
       name="id"
       th:value="${pro.id}">

<label>Product Name</label>
<input type="text"
       name="name"
       th:value="${pro.name}">

<label>Quantity</label>
<input type="number"
       name="quantity"
       th:value="${pro.quantity}">

<label>Price</label>
<input type="number"
       name="price"
       th:value="${pro.price}">

<button type="submit">
Update Product
</button>

</form>

</div>

</div>

</body>
</html>
