<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Products</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    min-height:100vh;
    background:
    radial-gradient(circle at top left,#1e1b4b,#050816 60%);
    
    display:flex;
    justify-content:center;
    align-items:center;

    padding:40px;
}

/* MAIN CONTAINER */

.main-box{
    width:95%;
    max-width:1400px;

    background:rgba(255,255,255,0.05);

    border:1px solid rgba(255,255,255,0.1);

    backdrop-filter:blur(15px);

    border-radius:30px;

    overflow:hidden;

    display:flex;

    box-shadow:0 0 30px rgba(0,0,0,0.5);
}

/* SIDEBAR */

.sidebar{
    width:260px;
    background:rgba(255,255,255,0.03);
    padding:40px 25px;
    border-right:1px solid rgba(255,255,255,0.1);
}

.logo{
    color:white;
    font-size:32px;
    font-weight:bold;
    margin-bottom:50px;
}

.menu a{
    display:block;
    text-decoration:none;
    color:#aaa;

    padding:15px;
    margin-bottom:15px;

    border-radius:12px;

    transition:0.3s;
}

.menu a:hover{
    background:#f5d06f;
    color:black;
}

.active{
    background:#f5d06f;
    color:black !important;
}

/* CONTENT */

.content{
    flex:1;
    padding:50px;
}

.title{
    color:white;
    font-size:45px;
    margin-bottom:10px;
}

.subtitle{
    color:#aaa;
    margin-bottom:40px;
}

/* PRODUCT GRID */

.grid{
    display:grid;

    grid-template-columns:
    repeat(auto-fit,minmax(280px,1fr));

    gap:30px;
}

/* CARD */

.card{
    background:rgba(255,255,255,0.05);

    border:1px solid rgba(255,255,255,0.1);

    border-radius:20px;

    padding:25px;

    transition:0.3s;
}

.card:hover{
    transform:translateY(-10px);
}

.card h2{
    color:#f5d06f;
    margin-bottom:20px;
}

.card p{
    color:#ddd;
    margin:10px 0;
}

/* BUTTONS */

.buttons{
    margin-top:20px;
    display:flex;
    gap:10px;
    flex-wrap:wrap;
}

.btn{
    text-decoration:none;
    padding:10px 15px;
    border-radius:10px;
    color:white;
    font-weight:bold;
    transition:0.3s;
}

.view{
    background:#16a34a;
}

.edit{
    background:#6366f1;
}

.delete{
    background:#dc2626;
}

.btn:hover{
    opacity:0.8;
}

</style>

</head>

<body>

<div class="main-box">

<!-- SIDEBAR -->

<div class="sidebar">

<div class="logo">
StoreAdmin
</div>

<div class="menu">

<a href="/home">
🏠 Home
</a>

<a href="/select" class="active">
📦 All Products
</a>

</div>

</div>

<!-- CONTENT -->

<div class="content">

<h1 class="title">
Our Products
</h1>

<p class="subtitle">
Browse & manage your products
</p>

<div class="grid">

<div class="card" th:each="p : ${pro}">

<h2 th:text="${p.name}"></h2>

<p>
<b>ID :</b>
<span th:text="${p.id}"></span>
</p>

<p>
<b>Quantity :</b>
<span th:text="${p.quantity}"></span>
</p>

<p>
<b>Price :</b>
₹<span th:text="${p.price}"></span>
</p>

<div class="buttons">

<a th:href="@{/part/{id}(id=${p.id})}"
class="btn view">
View
</a>

<a th:href="@{/edit/{id}(id=${p.id})}"
class="btn edit">
Edit
</a>

<a th:href="@{/delete/{id}(id=${p.id})}"
class="btn delete">
Delete
</a>

</div>

</div>

</div>

</div>

</div>

</body>
</html>
